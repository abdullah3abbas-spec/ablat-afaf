<script>
// githack mirrors GitHub but throttles big files: serve images/video from jsDelivr at the same commit.
// On GitHub Pages or any normal host, assets load relatively (ASSET = '').
window.ASSET = (function () {
  var m = /githack\.com$/.test(location.hostname) && location.pathname.match(/^\/([^/]+)\/([^/]+)\/([^/]+)\//);
  return m ? 'https://cdn.jsdelivr.net/gh/' + m[1] + '/' + m[2] + '@' + m[3] + '/' : '';
})();
</script>
